apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: demo-app

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo-app
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list"]


---



apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: demo-app
subjects:
- kind: ServiceAccount
  name: nginx-sa
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
